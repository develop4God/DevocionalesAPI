name: OCI A1.Flex Retry Launch

on:
  schedule:
    # Safety-net re-trigger: each job loops internally for ~5.5h (below
    # GitHub's 6h job cap) retrying every 20s. This cron just makes sure a
    # fresh job starts again if a previous one ever ran out its window
    # without success. concurrency below prevents overlapping runs.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: oci-a1-retry
  cancel-in-progress: false

jobs:
  retry-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Write OCI config and key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: us-ashburn-1
        run: |
          mkdir -p ~/.oci
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=~/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF

      - name: Check if instance already exists
        id: check
        run: |
          EXISTING=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --display-name gemma4-12b-server \
            --lifecycle-state RUNNING \
            --query "data[0].id" --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Instance already exists and is RUNNING: $EXISTING"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry launch across Ashburn ADs for up to 5.5 hours
        if: steps.check.outputs.found == 'false'
        id: launch
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          IMAGE_ID: "ocid1.image.oc1.iad.aaaaaaaacuygljashkvpqu5qqmlausq2vwrwasp3lxpbpitxjhvbhsktlhma"
          SUBNET_ID: "ocid1.subnet.oc1.iad.aaaaaaaagokuawamgikuy2r5uf4gsnrei3ctnbjn4irvbvwvuavqg4ssnmza"
          SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          echo "$SSH_PUBLIC_KEY" > /tmp/ssh_key.pub
          SUCCESS=false
          DEADLINE=$(( $(date +%s) + 5*3600 + 30*60 ))  # 5.5 hours from now
          ATTEMPT=0

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            for AD in "YOyk:US-ASHBURN-AD-1" "YOyk:US-ASHBURN-AD-2" "YOyk:US-ASHBURN-AD-3"; do
              ATTEMPT=$((ATTEMPT + 1))
              echo "[$(date +%H:%M:%S)] Attempt $ATTEMPT — trying $AD ..."
              OUTPUT=$(oci compute instance launch \
                --availability-domain "$AD" \
                --compartment-id "$COMPARTMENT_ID" \
                --display-name gemma4-12b-server \
                --shape VM.Standard.A1.Flex \
                --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --ssh-authorized-keys-file /tmp/ssh_key.pub 2>&1) && LAUNCH_RC=0 || LAUNCH_RC=$?

              if [ "$LAUNCH_RC" -eq 0 ]; then
                echo "SUCCESS on $AD"
                echo "$OUTPUT"
                SUCCESS=true
                echo "launched=true" >> "$GITHUB_OUTPUT"
                break 2
              fi

              if echo "$OUTPUT" | grep -q "Out of host capacity"; then
                echo "Out of host capacity on $AD, trying next."
                continue
              fi

              if echo "$OUTPUT" | grep -qE '"status": 429|TooManyRequests'; then
                echo "Rate limited (429) on $AD. Backing off for 90s before continuing."
                sleep 90
                continue
              fi

              echo "Unexpected error on $AD:"
              echo "$OUTPUT"
              exit 1
            done

            if [ "$(date +%s)" -lt "$DEADLINE" ]; then
              echo "All ADs out of capacity this round, sleeping 30s..."
              sleep 30
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "5.5h window exhausted with no capacity. Job ending; next scheduled run will pick up again."
            echo "launched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for public IP
        if: steps.check.outputs.found == 'true' || steps.launch.outputs.launched == 'true'
        id: getip
        run: |
          for i in $(seq 1 30); do
            INSTANCE_ID=$(oci compute instance list \
              --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
              --display-name gemma4-12b-server \
              --lifecycle-state RUNNING \
              --query "data[0].id" --raw-output)
            VNIC=$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --query "data[0].\"public-ip\"" --raw-output 2>/dev/null || echo "")
            if [ -n "$VNIC" ] && [ "$VNIC" != "null" ]; then
              echo "public_ip=$VNIC" >> "$GITHUB_OUTPUT"
              echo "Public IP: $VNIC"
              break
            fi
            echo "Waiting for public IP... ($i/30)"
            sleep 10
          done

      - name: Install Ollama and pull gemma4:12b
        if: steps.getip.outputs.public_ip != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ steps.getip.outputs.public_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
              "ubuntu@$PUBLIC_IP" "echo ok"; then
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done

          ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=accept-new "ubuntu@$PUBLIC_IP" \
            "curl -fsSL https://ollama.com/install.sh | sh"

          ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=accept-new "ubuntu@$PUBLIC_IP" \
            "ollama pull gemma4:12b"

          echo "Setup complete. gemma4:12b ready on $PUBLIC_IP"
