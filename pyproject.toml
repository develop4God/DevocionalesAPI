[project]
name = "devocionales-api"
version = "0.1.0"
description = "DevocionalesAPI — seed generation and content pipeline"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "python-dotenv",
    "anthropic==0.42.0",
    "fastapi==0.135.2",
    "google-genai==1.68.0",
    "openai",
    "pydantic==2.12.5",
    "requests==2.33.0",
    "tenacity==9.1.4",
    "tqdm==4.67.3",
    "uvicorn==0.42.0",
]

[tool.setuptools.packages.find]
include = ["seed_generation*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
